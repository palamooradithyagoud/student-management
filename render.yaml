services:
  - type: web
    name: student-management-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: HOD_USERNAME
        value: hod.csm
      - key: HOD_PASSWORD
        value: hod_csm_secure_2026
      # Set ALLOWED_ORIGINS to your Vercel URL once deployed, e.g. https://your-project.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app
