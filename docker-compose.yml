version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: csm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: csm_user
      POSTGRES_PASSWORD: csm_password
      POSTGRES_DB: csm_academic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://csm_user:csm_password@postgres:5432/csm_academic_db
      JWT_SECRET: csm_academic_intelligence_super_secret_jwt_key_2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      HOD_USERNAME: hod.csm
      HOD_PASSWORD: hod_csm_secure_2026
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
